<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242e37" />
      <stop offset="100%" stop-color="#12171c" />
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#87d4bd" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#87d4bd" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#39454f" stroke-width="4" />
  
  <!-- Outer radar ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#87d4bd" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="6,6" />
  <!-- Mid radar ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#87d4bd" stroke-opacity="0.38" stroke-width="3.5" />
  <!-- Inner radar ring -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#87d4bd" stroke-opacity="0.55" stroke-width="4" />

  <!-- Crosshair axes -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#87d4bd" stroke-opacity="0.25" stroke-width="2.5" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#87d4bd" stroke-opacity="0.25" stroke-width="2.5" />

  <!-- Radar sweep pie/sector -->
  <path d="M 256 256 L 256 76 A 180 180 0 0 1 383 129 Z" fill="url(#sweepGrad)" />

  <!-- Sweep line -->
  <line x1="256" y1="256" x2="383" y2="129" stroke="#87d4bd" stroke-width="3.5" stroke-linecap="round" />

  <!-- Radar ping blip with pulse -->
  <circle cx="340" cy="172" r="16" fill="#87d4bd" fill-opacity="0.25" />
  <circle cx="340" cy="172" r="8" fill="#87d4bd" />
  <circle cx="340" cy="172" r="4" fill="#ffffff" />

  <!-- Second subtle blip -->
  <circle cx="180" cy="310" r="10" fill="#87d4bd" fill-opacity="0.2" />
  <circle cx="180" cy="310" r="5" fill="#87d4bd" />

  <!-- Center compass / core dot -->
  <circle cx="256" cy="256" r="15" fill="#87d4bd" />
  <circle cx="256" cy="256" r="7" fill="#171d23" />
</svg>
